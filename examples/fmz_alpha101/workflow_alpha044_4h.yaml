# FMZ Alpha044 Single-Factor Backtest Configuration (Template)
# Alpha044 = -1 * corr(high, cs_rank(volume), window)
# Adjust `window`, date range, and `instruments` as needed.

qlib_init:
  provider_uri: "~/.qlib/qlib_data/crypto_data_perp_4h"
  region: crypto

data_handler_config:
  class: Alpha044FMZHandler
  module_path: qlib.contrib.data.handler_alpha044_fmz
  start_time: "2023-01-01"
  end_time: "2023-12-31"
  fit_start_time: "2023-01-01"
  fit_end_time: "2023-12-31"
  instruments: all
  freq: "240min"
  window: 6

backtest:
  start_time: "2023-01-01"
  end_time: "2023-12-31"
  account: 10000
  benchmark: "BINANCE_UM.BTCUSDT"

strategy:
  class: FMZNeutralStrategy
  module_path: qlib.contrib.strategy.fmz_neutral_strategy
  topk_long: 40
  topk_short: 40
  value_per_position: 300

exchange:
  freq: "240min"
  limit_threshold: 0.0
  deal_price: open
  open_cost: 0.0002
  close_cost: 0.0002
  min_cost: 0
