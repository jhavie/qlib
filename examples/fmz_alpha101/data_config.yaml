# FMZ Alpha101 数据采集配置
# 125 Binance USDS-M 永续合约, 4h K线, 2022-01-01 ~ 2025-12-31

data_collection:
  interval: "4h"
  start: "2025-01-01"
  end: "2025-03-31"
  delay: 0.3

  # 输出目录
  source_dir: "~/.qlib/binance_um/source_12coins_4h"
  normalize_dir: "~/.qlib/binance_um/normalize_12coins_4h"
  qlib_dir: "~/.qlib/qlib_data/crypto_data_perp_12coins_4h"

  # 123 符号列表（与 backtest.yaml strategy section 对齐）
  symbols:
    - AAVEUSDT
    - ADAUSDT
    - BNBUSDT
    - BTCUSDT
    - DOGEUSDT
    - ETHUSDT
    - LINKUSDT
    - OPUSDT
    - SOLUSDT
    - UNIUSDT
    - ARBUSDT
    - SUIUSDT

